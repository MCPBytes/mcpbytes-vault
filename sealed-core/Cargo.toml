[package]
name = "mcpbytes-sealed-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
json = ["dep:serde", "dep:base64"]
kat = []

[dependencies]
hpke = { version = "=0.14.1", default-features = false, features = ["x25519", "chacha"] }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.8.2", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "alloc"], optional = true }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
getrandom = { version = "=0.4.1", features = ["sys_rng"] }
serde_json = "=1.0.145"
hex = "=0.4.3"
