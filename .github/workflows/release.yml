name: Release

# Push a tag like v0.2.0: each platform is tested, built and packaged, then one job publishes the
# GitHub release with the archives, SHA256SUMS.txt and the one-line install scripts. Asset names carry
# no version, so .../releases/latest/download/<name> always resolves (the scripts rely on it).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-2025, target: x86_64-pc-windows-msvc, platform: windows-x64, exe: .exe, py: python }
          - { os: macos-15, target: aarch64-apple-darwin, platform: macos-arm64, exe: "", py: python3 }
          # The oldest supported image, so the binary runs on older glibc versions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x64, exe: "", py: python3 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Linux build dependencies (Secret Service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Test
        run: cargo test --locked
      - name: Build (local-only, the default)
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test the release binary
        run: ${{ matrix.py }} tests/stdio_smoke.py "target/${{ matrix.target }}/release/mcpbytes-vault${{ matrix.exe }}"
      - name: Package
        run: |
          folder="mcpbytes-vault-${GITHUB_REF_NAME#v}-${{ matrix.platform }}"
          mkdir -p "dist/$folder"
          cp "target/${{ matrix.target }}/release/mcpbytes-vault${{ matrix.exe }}" README.md LICENSE "dist/$folder/"
          cp -r examples "dist/$folder/examples"
          cargo metadata --locked --format-version 1 --filter-platform ${{ matrix.target }} > metadata.json
          ${{ matrix.py }} scripts/third_party.py metadata.json "dist/$folder"
          cd dist
          # zip on Windows, tar.gz elsewhere (tar is always there; it keeps the executable bit).
          if [ "$RUNNER_OS" = Windows ]; then
            ${{ matrix.py }} -m zipfile -c "mcpbytes-vault-${{ matrix.platform }}.zip" "$folder"
          else
            tar -czf "mcpbytes-vault-${{ matrix.platform }}.tar.gz" "$folder"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: dist/mcpbytes-vault-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and install scripts
        run: |
          cd dist
          sha256sum mcpbytes-vault-*.zip mcpbytes-vault-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cp ../scripts/install.sh ../scripts/install.ps1 .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MCPBytes Vault ${GITHUB_REF_NAME#v}" --generate-notes
